name: Local quality gates
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: false
    inputs:
      build:
        description: Build frontend after validation (release builds its own immutable artifact)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deep-review:
    uses: ./.github/workflows/deep-review.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test tests/unit/release108.test.mjs
      - run: node --test tests/unit/deep-review.test.mjs
      - run: npm run test:release-config
      - run: node scripts/release/test-integrations.mjs rules
      - run: npm run test:http
      - run: npm run test:restore
      - run: npm audit --omit=dev --audit-level=high
      - if: ${{ github.event_name != 'push' || inputs.build }}
        run: npm run build
