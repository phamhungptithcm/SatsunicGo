changelog:
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Performance
      labels: [performance]
    - title: Documentation
      labels: [documentation]
    - title: Maintenance and other changes
      labels: ['*']
