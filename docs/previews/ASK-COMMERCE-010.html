<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask · Nội dung tự nhiên</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111c35;font-size:14px}.back{padding:20px 28px;opacity:.22;filter:blur(3px);display:flex;justify-content:space-between}.dialog{position:fixed;inset:70px 14px 22px;margin:auto;max-width:536px;background:white;border:1px solid #e1e5ec;border-radius:24px;box-shadow:0 12px 36px #111c3510;display:flex;flex-direction:column;overflow:hidden}.head{padding:23px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f2f5}.brand{font-size:20px;font-weight:750;letter-spacing:-.05em}.brand span{color:#163cff}.head small{color:#68768b}.body{flex:1;overflow:auto;padding:32px 24px;display:flex;flex-direction:column;justify-content:center}.body h1{font-size:23px;line-height:1.25;font-weight:600;letter-spacing:-.035em;margin:0 0 10px}.body p{color:#68768b;font-size:14px;line-height:1.7;margin:0;max-width:350px}.intro{padding:0 10px 45px}.bottom{padding:0 14px 16px}.inputbox{border:1px solid #dde2eb;border-radius:28px;background:white;box-shadow:0 2px 10px #111c3505;transition:border-color .15s}.inputbox:focus-within,.inputbox.drag{border-color:#163cff;box-shadow:0 0 0 2px #163cff0c}.inputrow{display:flex;align-items:center;gap:7px;padding:9px}.inputrow textarea{resize:none;border:0;background:transparent;outline:none;flex:1;min-width:0;height:40px;padding:10px 3px;font:inherit;font-size:14px;color:#111c35}.inputrow textarea::placeholder{color:#68768b}.icon{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:#68768b;flex-shrink:0}.icon:hover{background:#f3f5f8}.icon:focus-visible{outline:2px solid #163cff;outline-offset:2px}.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}.send{background:#163cff;color:white}.send:hover{background:#1234dc}.send:disabled{background:#eef0f6;color:#a9b2c2;cursor:default}.notice{text-align:center;font-size:10px;color:#68768b;line-height:1.6;margin:10px 12px 0}.notice a{color:#163cff;text-decoration:none}.previews{display:flex;gap:8px;padding:12px 14px 0;flex-wrap:wrap}.previews:empty{display:none}.photo{position:relative;width:62px;height:62px;border:1px solid #e3e7ef;border-radius:12px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.remove{position:absolute;right:3px;top:3px;border:0;background:#fffffff0;border-radius:50%;width:21px;height:21px;color:#111c35;cursor:pointer}.bubble{background:#f5f7fa;border-radius:18px 18px 4px 18px;padding:14px 16px;align-self:flex-end;max-width:90%;margin-bottom:24px}.reply{line-height:1.65;padding:0 3px;color:#344158}.error{font-size:12px;color:#82452b;padding:0 12px 8px}.prototype{position:fixed;bottom:2px;left:14px;font-size:9px;color:#8793a5}.file{display:none}@media(max-width:480px){.dialog{inset:12px 8px 18px;border-radius:22px}.head{padding:20px}.body{padding:25px 22px}.notice{font-size:10px}}
</style><div class="back"><b>SatsunicGo</b><span>Tài khoản · Đơn của tôi</span></div><main class="dialog"><header class="head"><div class="brand">Satsunic<span>Go</span></div><small>Hỏi SatsunicGo</small></header><section class="body" id="body"><div class="intro"><h1>Bạn đang tìm món gì?</h1><p>Gửi tên, link hoặc ảnh sản phẩm.<br>Mình sẽ giúp bạn chuẩn bị yêu cầu mua hộ.</p></div></section><footer class="bottom"><form class="inputbox" id="box"><div class="previews" id="photos"></div><div class="error" id="error" role="status"></div><div class="inputrow"><button class="icon" type="button" id="attach" aria-label="Thêm ảnh sản phẩm" title="Thêm ảnh sản phẩm"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><input class="file" id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple><textarea id="text" aria-label="Hỏi SatsunicGo" placeholder="Hỏi bất cứ điều gì…" maxlength="1000"></textarea><button class="icon send" id="send" disabled aria-label="Gửi tin nhắn"><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button><button class="icon" type="button" aria-label="Đóng hội thoại" title="Đóng hội thoại"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></form><p class="notice">Khi dùng AI, nội dung có thể được Google xử lý. <a href="#privacy">Quyền riêng tư</a></p></footer></main><div class="prototype">Bản mẫu giao diện · chưa kết nối AI hoặc tạo đơn</div><script>
const box=document.querySelector('#box'),file=document.querySelector('#file'),text=document.querySelector('#text'),photos=document.querySelector('#photos'),send=document.querySelector('#send'),error=document.querySelector('#error');let selected=[];
function render(){photos.replaceChildren();selected.forEach((p,i)=>{const d=document.createElement('div');d.className='photo';const im=document.createElement('img');im.src=p.url;im.alt='Ảnh sản phẩm đã chọn';const b=document.createElement('button');b.className='remove';b.type='button';b.textContent='×';b.setAttribute('aria-label','Bỏ ảnh '+(i+1));b.onclick=()=>{URL.revokeObjectURL(p.url);selected.splice(i,1);render()};d.append(im,b);photos.append(d)});send.disabled=!text.value.trim()&&!selected.length}
function add(list){error.textContent='';if(list.length+selected.length>3){error.textContent='Bạn có thể gửi tối đa 3 ảnh mỗi lần.';return}for(const f of list){if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>2097152){error.textContent='Chọn ảnh PNG, JPEG hoặc WebP tối đa 2 MB.';continue}selected.push({url:URL.createObjectURL(f)})}render()}
document.querySelector('#attach').onclick=()=>file.click();file.onchange=()=>{add([...file.files]);file.value=''};text.oninput=render;box.ondragover=e=>{e.preventDefault();box.classList.add('drag')};box.ondragleave=()=>box.classList.remove('drag');box.ondrop=e=>{e.preventDefault();box.classList.remove('drag');add([...e.dataTransfer.files])};box.onpaste=e=>{if(e.clipboardData.files.length){e.preventDefault();add([...e.clipboardData.files])}};box.onsubmit=e=>{e.preventDefault();if(send.disabled)return;const body=document.querySelector('#body');body.replaceChildren();body.style.justifyContent='flex-start';const b=document.createElement('div');b.className='bubble';b.textContent=text.value.trim()||'Mình muốn tìm món trong ảnh này.';const r=document.createElement('div');r.className='reply';r.textContent='Bạn muốn mua từ Mỹ, Nhật hay Hàn?';body.append(b,r);text.value='';selected.forEach(p=>URL.revokeObjectURL(p.url));selected=[];render()};text.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();box.requestSubmit()}};
</script></html>
