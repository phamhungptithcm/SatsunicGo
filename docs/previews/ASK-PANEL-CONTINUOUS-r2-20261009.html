.top{padding:12px 28px;border-bottom:0;gap:6px 12px}.panel-body{position:relative;flex:1;min-height:0;overflow:hidden;container-name:ask-middle;container-type:size}.stream{height:100%;padding:14px 28px 20px}.turn{margin-bottom:20px;padding-top:0}.question{margin-bottom:14px}.question p{padding:9px 15px}.answer{line-height:1.65}.review{margin:14px 0 6px;border:0;padding:0}.review h2{margin-bottom:3px}.detail-row{margin-top:12px}.detail-row.total{margin-top:5px}.detail-row.total strong{font-size:calc(19px * var(--text-scale))}.review details{margin-top:10px}.consequence{margin-top:12px;line-height:1.6}.review-actions{margin-top:12px}.review-status{margin-top:12px;line-height:1.6}.reply-hint{margin-top:8px}.bottom{padding:9px 28px 20px}.composer{padding:9px 10px 9px 14px}.composer textarea:disabled{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}.editing-note{max-width:680px;margin:7px auto 0;font-size:calc(11px * var(--text-scale));line-height:1.5;color:var(--muted)}.return-shell{position:fixed;z-index:4;bottom:max(20px,env(safe-area-inset-bottom));right:20px}

@media(max-width:1200px){:root{--header-height:76px}.public-topbar{padding:0 20px}.public-links{display:none}.public-menu{display:block}}

<body>
<div class="public-shell" id="public-shell" aria-hidden="true" inert>
<header class="public-topbar"><div class="public-nav">
<div class="public-brand"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 12 7-12 7-12-7 12-7Z"/><path d="M4 10v13l12 7 12-7V10M16 17v13M10 6l12 7"/></svg><span>Satsunic<em>Go</em></span></div>
<div class="public-links"><span>Sản phẩm</span><span>Mua hộ</span><span>Biểu phí</span><span>Membership</span><span>Bài viết</span><span>Hỗ trợ</span></div>
<div class="public-actions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4h2l2 11h11l2-8H6M9 20h.01M17 20h.01" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="public-request">Mua hộ ↗</span><span class="public-menu"><i></i><i></i></span></div>
</div></header><div class="public-page"></div></div>
<div class="veil" id="veil" aria-hidden="true"></div>
<section class="panel" id="shell" role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <header class="top">
    <div class="brand" id="panel-title">Satsunic<span>Go</span></div>
    <nav aria-label="Điều khiển hội thoại" id="controls">
      <button type="button" class="icon" id="history-toggle" aria-label="Lịch sử hội thoại" title="Lịch sử hội thoại" aria-expanded="false" aria-controls="history">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3.5 10a8.5 8.5 0 1 1 1.2 6.5M3.5 4.5V10H9M12 7v5l3.3 2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="language" id="languages" aria-label="Ngôn ngữ">
        <button class="lang" type="button" data-lang="vi" aria-pressed="true" aria-label="Tiếng Việt">VI</button>
        <button class="lang" type="button" data-lang="en" aria-pressed="false" aria-label="English">EN</button>
      </div>
      <button type="button" class="icon" id="close-chat" aria-label="Đóng hội thoại" title="Đóng hội thoại"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg></button>
    </nav>
  </header>
  <div class="panel-body" id="panel-body">
  <div class="stream" id="stream" tabindex="-1">
    <div class="reading">
      <div class="history-note" id="history-note" hidden><span id="history-notice"></span><button class="text-button" id="return-current" type="button"></button></div>
      <div id="current-view">
        <section class="turn" id="selection-turn">
          <div class="question"><p id="selection-question"></p></div>
          <div class="answer"><p id="selection-answer"></p></div>
          <section class="review" id="review" aria-labelledby="product-title">
            <h2 id="product-title">Áo thun AIRism</h2>
            <p class="variant" id="variant-line"></p>
            <div class="detail-row"><span id="unit-label"></span><strong id="unit-value"></strong></div>
            <div class="detail-row total"><span id="total-label"></span><strong id="total-value"></strong></div>
            <details><summary id="terms-label"></summary><p id="terms-value"></p></details>
            <p class="consequence" id="consequence"></p>
            <p class="review-status" id="review-status" role="status" aria-live="polite"></p>
            <div class="review-actions"><button type="button" class="primary" id="confirm"></button><button type="button" class="text-button" id="edit"></button></div>
            <p class="reply-hint" id="reply-hint"></p>
          </section>
        </section>
        <div id="followups" role="log" aria-label="Tin nhắn mới" aria-live="polite" aria-relevant="additions"></div>
      </div>
      <section class="history-turn" id="old-view" hidden tabindex="-1"><h2 id="old-title"></h2><div class="question"><p id="old-question"></p></div><div class="answer"><p id="old-answer"></p></div></section>
    </div>
  </div>
<section class="sheet" id="sheet" hidden aria-labelledby="sheet-title" aria-describedby="sheet-help">
  <form id="edit-form">
    <header class="sheet-head"><div><h2 id="sheet-title" tabindex="-1"></h2><button class="icon" type="button" id="close-sheet" aria-label="Về hội thoại"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg></button></div></header>
    <div class="sheet-body"><div class="form-reading">
      <p id="sheet-help"></p>
      <label class="field"><span id="product-label"></span><input id="product" readonly value="Áo thun AIRism"></label>
      <div class="variant-fields">
      <label class="field"><span id="colour-label"></span><select id="colour"><option value="white"></option><option value="black"></option></select></label>
      <label class="field"><span id="size-label"></span><select id="size"><option>M</option><option>L</option><option>XL</option></select></label>
      <label class="field"><span id="quantity-label"></span><input id="quantity" type="number" inputmode="numeric" min="1" max="100" step="1" required value="2" aria-describedby="quantity-help"><small id="quantity-help"></small></label>
      </div>
      <p class="draft-notice" id="draft-notice" role="status"></p>
    </div></div>
    <footer class="sheet-footer"><div><button type="button" class="text-button" id="back-chat"></button><button type="submit" class="primary" id="review-again"></button></div></footer>
  </form>
</section>
<section class="history" id="history" aria-labelledby="history-title" hidden>
<header class="history-head"><div><h2 id="history-title" tabindex="-1"></h2><button type="button" class="icon" id="close-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg></button></div></header>
<div class="history-list"><div><button type="button" id="history-current">Áo thun AIRism<small id="history-current-detail"></small></button><button type="button" id="history-old">Phí vận chuyển từ Nhật<small id="history-old-detail"></small></button></div></div>
</section>
  </div>
  <footer class="bottom">
    <form class="composer" id="composer"><label for="message" class="sr" id="message-label"></label><textarea id="message" rows="1" maxlength="1200" aria-describedby="privacy editing-note"></textarea><button class="send" type="submit" id="send" disabled aria-label="Gửi tin nhắn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 18V5m-5 5 5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>
    <p class="privacy" id="privacy" hidden></p>
    <p class="editing-note" id="editing-note" hidden></p>
  </footer>
</section>
<div class="return-shell" id="closed" hidden><button type="button" class="primary" id="reopen"></button></div>

<script>
(() => {
  'use strict';
  if(new URLSearchParams(location.search).get('text')==='200')document.documentElement.style.setProperty('--text-scale','2');
  const $ = id => document.getElementById(id);

    setState(mode){if(!['review','stale','unknown','loading','empty','unavailable','signed-out'].includes(mode))throw Error('Unsupported preview state');++loadTicket;state.revision++;state.history=false;state.editing=false;state.listing=false;state.readiness=['signed-out','loading','unavailable'].includes(mode)?mode:'ready';state.operation=mode==='unknown'?Object.freeze({id:'pending-local-1',selection:snapshot()}):null;state.mode=mode;state.rendered=0;seenDetails.clear();seenRanges.clear();state.preview=mode==='review'?snapshot():null;if(mode==='review')review();else render();},
    reveal(){revealReview(true);},
    inspect(){return JSON.parse(JSON.stringify({language:state.lang,mode:state.mode,readiness:state.readiness,history:state.history,editing:state.editing,listing:state.listing,revision:state.revision,rendered:state.rendered,selection:state.selection,preview:state.preview,operation:state.operation,localSelections:state.attempts}));}
  };
  $('stream').addEventListener('scroll',updateRendered,{passive:true});window.addEventListener('resize',updateRendered);
  review();revealReview(true);requestAnimationFrame(()=>$('message').focus({preventScroll:true}));
  const requested=new URLSearchParams(location.search).get('state');if(requested)window.askPreview.setState(requested);
})();
</script>
