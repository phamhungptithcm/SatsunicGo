<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Theo dõi đơn hàng · SatsunicGo · Mockup</title>
    <style>
      :root {
        font-family: Inter, Arial, sans-serif;
        color: #111c35;
        background: #fff;
        --blue: #163cff;
        --border: #e6eaf1;
        --muted: #637087;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      select {
        font: inherit;
      }
      button,
      a,
      select {
        touch-action: manipulation;
        outline-offset: 5px;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--blue);
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      p {
        line-height: 1.65;
        margin: 8px 0;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        letter-spacing: -0.04em;
      }
      h1 {
        font-size: 29px;
        font-weight: 700;
      }
      small,
      .muted {
        color: var(--muted);
      }
      svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .reviewbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 26px;
        background: #f7f8fb;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
      }
      .reviewbar strong {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin-right: 10px;
      }
      .reviewbar label {
        margin-left: auto;
      }
      .reviewbar select {
        min-height: 34px;
        background: white;
        color: #111c35;
        border: 1px solid #dce2ed;
        border-radius: 7px;
        padding: 6px 10px;
        max-width: 100%;
      }
      .controlbutton {
        min-height: 34px;
        padding: 7px 10px;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 7px;
        color: var(--muted);
        font-size: 11px;
      }
      .controlbutton[aria-pressed="true"] {
        background: white;
        border-color: var(--border);
        color: #111c35;
        box-shadow: 0 1px 3px #111c3505;
      }
      .controlbutton svg {
        width: 12px;
        height: 12px;
        vertical-align: -2px;
        margin-right: 4px;
      }
      .topbar {
        height: 76px;
        border-bottom: 1px solid var(--border);
        padding: 0 32px;
        display: flex;
        align-items: center;
        gap: 32px;
      }
      .brand {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -1px;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .brand b {
        color: var(--blue);
      }
      .brand svg {
        width: 30px;
        color: var(--blue);
      }
      .topnav {
        display: flex;
        gap: 26px;
        font-size: 13px;
        margin: auto;
        color: #4d5870;
      }
      .avatar {
        border-radius: 50%;
        background: #f0f3ff;
        color: var(--blue);
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
      }
      .workspace {
        max-width: 1260px;
        margin: 0 auto;
        padding: 38px 28px 55px;
        display: grid;
        grid-template-columns: 172px minmax(0, 1fr);
        gap: 52px;
      }
      .rail {
        font-size: 13px;
        padding-top: 6px;
      }
      .rail small {
        display: block;
        font-size: 9px;
        letter-spacing: 0.12em;
        margin: 8px 12px 20px;
      }
      .rail a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 12px;
        border-radius: 9px;
        color: var(--muted);
      }
      .rail a.active {
        background: #eef2ff;
        color: var(--blue);
        font-weight: 650;
      }
      .rail hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 22px 12px;
      }
      .bread {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 24px;
        display: flex;
        gap: 10px;
      }
      .pagehead {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 26px;
      }
      .pagehead p {
        font-size: 12px;
        margin: 8px 0 0;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 11px 15px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: white;
        color: #111c35;
        font-size: 12px;
        font-weight: 600;
        transition:
          background-color 160ms,
          border-color 160ms,
          transform 160ms;
      }
      .button svg {
        width: 16px;
        height: 16px;
      }
      .button.primary {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: white;
        overflow: hidden;
      }
      .tracking-panel {
        box-shadow: 0 4px 22px #111c3503;
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 244px;
        gap: 38px;
        padding: 30px 30px 27px;
        align-items: center;
      }
      .hero-main {
        min-width: 0;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .status::before {
        content: "";
        width: 6px;
        height: 6px;
        background: currentColor;
        border-radius: 50%;
      }
      .hero h2 {
        font-size: 32px;
        line-height: 1.22;
        font-weight: 700;
      }
      .hero p {
        font-size: 12px;
        color: var(--muted);
        max-width: 390px;
        margin: 12px 0 0;
      }
      .route {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        color: #53627d;
        font-size: 11px;
        margin-top: 17px;
      }
      .route svg {
        width: 15px;
        height: 15px;
        color: #8390a9;
      }
      .country {
        color: #53627d;
        font-size: 9px;
        font-weight: 700;
        border: 1px solid #e1e6f0;
        border-radius: 4px;
        padding: 3px 4px;
      }
      .eta {
        background: #f4f6ff;
        border: 1px solid #e7ebff;
        border-radius: 14px;
        padding: 20px 21px;
      }
      .eta-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 500;
        color: #53627d;
      }
      .eta-title svg {
        width: 15px;
        height: 15px;
        color: var(--blue);
      }
      .eta strong {
        display: block;
        font-size: 28px;
        letter-spacing: -0.055em;
        margin: 11px 0 7px;
        color: var(--blue);
        line-height: 1.15;
      }
      .eta small {
        display: block;
        font-size: 10px;
        line-height: 1.65;
        color: #5e6a83;
      }
      .eta .year {
        display: block;
        font-size: 11px;
        color: #637087;
        margin-bottom: 10px;
      }
      .steps {
        list-style: none;
        padding: 12px 25px 24px;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
      .steps li {
        position: relative;
        min-width: 0;
        text-align: center;
        font-size: 11px;
        line-height: 1.5;
      }
      .steps li::after {
        content: "";
        position: absolute;
        left: calc(50% + 23px);
        right: calc(-50% + 23px);
        top: 23px;
        height: 2px;
        background: #edf0f5;
        transform-origin: left center;
        z-index: 0;
      }
      .steps li:last-child::after {
        display: none;
      }
      .steps .done::after {
        background: #9eafff;
      }
      .stepbutton {
        border: 0;
        background: transparent;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 1;
        color: inherit;
        min-height: 100px;
        padding: 0 3px;
        outline-offset: 0;
        border-radius: 10px;
      }
      .stepicon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid #e3e7f0;
        background: white;
        margin-bottom: 13px;
        color: #8592a9;
        position: relative;
        transition:
          transform 220ms var(--ease),
          background-color 180ms,
          border-color 180ms,
          color 180ms;
      }
      .stepicon svg {
        width: 19px;
        height: 19px;
      }
      .steps .done .stepicon {
        background: #f1f4ff;
        border-color: #e4eaff;
        color: var(--blue);
      }
      .steps .current .stepicon {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
        box-shadow: 0 0 0 6px #f0f3ff;
      }
      .steps .current .stepicon::before {
        content: "";
        position: absolute;
        inset: -7px;
        border: 1px solid #cdd7ff;
        border-radius: 50%;
      }
      .steps b {
        display: block;
        font-size: 11px;
        font-weight: 600;
        max-width: 128px;
        color: #637087;
      }
      .steps .done b {
        color: #35425e;
      }
      .steps .current b {
        color: var(--blue);
        font-weight: 700;
      }
      .steps small {
        font-size: 9px;
        display: block;
        margin-top: 6px;
        min-height: 16px;
        color: #68758d;
      }
      .steps .current small {
        background: #f0f3ff;
        color: var(--blue);
        padding: 2px 7px;
        border-radius: 4px;
        font-weight: 600;
      }
      .steps .stepbutton[aria-pressed="true"] .stepicon {
        border-color: #b2c1ff;
      }
      .contextstrip {
        padding: 19px 26px;
        border-top: 1px solid var(--border);
        background: #fafbfe;
        display: grid;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        gap: 12px;
        min-height: 92px;
      }
      .contexticon {
        color: var(--blue);
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: #edf2ff;
        border-radius: 10px;
      }
      .contexticon svg {
        width: 17px;
        height: 17px;
      }
      .contextstrip span.label {
        display: block;
        font-size: 9px;
        color: #637087;
        letter-spacing: 0.07em;
        margin-bottom: 5px;
      }
      .contextstrip strong {
        display: block;
        font-size: 13px;
        letter-spacing: -0.015em;
      }
      .contextstrip p {
        font-size: 11px;
        color: var(--muted);
        margin: 4px 0 0;
        max-width: 520px;
      }
      .contextstrip .resetstep {
        border: 0;
        background: none;
        color: var(--blue);
        min-height: 44px;
        padding: 8px;
        font-size: 11px;
      }
      .readtime {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 0;
        padding: 13px 3px 0;
        font-size: 10px;
        color: #6c778d;
        line-height: 1.6;
      }
      .readtime span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .readtime svg {
        width: 12px;
        height: 12px;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(275px, 1fr);
        gap: 22px;
        margin-top: 26px;
        align-items: start;
      }
      .cardbody {
        padding: 25px;
      }
      .sectionhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .sectionhead h2 {
        font-size: 16px;
        letter-spacing: -0.025em;
        font-weight: 650;
      }
      .tag {
        font-size: 9px;
        background: #f6f7fa;
        color: #606d84;
        border: 1px solid #e9ecf3;
        padding: 4px 7px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .events {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .events li {
        position: relative;
        display: grid;
        grid-template-columns: 57px minmax(0, 1fr);
        gap: 22px;
        padding: 0 0 26px;
        font-size: 12px;
      }
      .events li::before {
        content: "";
        position: absolute;
        left: 65px;
        top: 7px;
        width: 7px;
        height: 7px;
        border: 2px solid #cbd4e4;
        background: white;
        border-radius: 50%;
        z-index: 1;
      }
      .events li::after {
        content: "";
        position: absolute;
        left: 68px;
        top: 14px;
        bottom: 0;
        width: 1px;
        background: #e6eaf2;
      }
      .events li:last-child {
        padding-bottom: 0;
      }
      .events li:last-child::after {
        display: none;
      }
      .events .latest::before {
        border-color: var(--blue);
        background: var(--blue);
        box-shadow: 0 0 0 4px #eef2ff;
      }
      .events time {
        color: #6a778f;
        font-size: 10px;
        line-height: 1.8;
      }
      .events time b {
        color: #394761;
        font-size: 11px;
      }
      .events .entry {
        padding-left: 5px;
      }
      .entry b {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .entry p {
        font-size: 11px;
        color: var(--muted);
        margin: 5px 0 0;
      }
      .parcel {
        padding: 16px 0;
        border-top: 1px solid var(--border);
        font-size: 12px;
      }
      .parcel:first-of-type {
        padding-top: 0;
        border: 0;
      }
      .parcel h3 {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0;
      }
      .parcel dl {
        display: grid;
        grid-template-columns: 100px minmax(0, 1fr);
        margin: 17px 0 0;
        gap: 11px;
        font-size: 11px;
        line-height: 1.6;
      }
      .parcel dt {
        color: #6b7890;
      }
      .parcel dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .parcel p {
        color: var(--muted);
        font-size: 10px;
        margin-top: 13px;
      }
      .subnote {
        padding: 13px 14px;
        border-radius: 9px;
        background: #f8f9fc;
        font-size: 10px;
        color: #6b7890;
        line-height: 1.65;
      }
      .product {
        margin-top: 18px;
        border-top: 1px solid var(--border);
        padding-top: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
      }
      .producticon {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 39px;
        height: 44px;
        background: #f6f7fb;
        border-radius: 7px;
        color: #8d9bb7;
      }
      .producticon svg {
        width: 23px;
        height: 23px;
      }
      .product small {
        display: block;
        font-size: 10px;
        margin-top: 5px;
      }
      .notice {
        margin-top: 18px;
        border: 1px solid #eedfc1;
        background: #fffcf6;
        border-radius: 12px;
        padding: 15px 18px;
        font-size: 11px;
        line-height: 1.7;
        color: #74634a;
      }
      .notice b {
        display: block;
        color: #805612;
        font-size: 12px;
        margin-bottom: 3px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 10px;
        color: var(--muted);
        margin-top: 24px;
      }
      .foot a {
        color: var(--blue);
      }
      .empty {
        padding: 55px 25px;
        text-align: center;
      }
      .empty h2 {
        font-size: 22px;
      }
      .empty p {
        font-size: 12px;
        color: var(--muted);
      }
      .empty > svg {
        width: 38px;
        height: 38px;
        color: var(--blue);
        margin-bottom: 15px;
      }
      .empty .button {
        margin-top: 12px;
      }
      .loadingbar {
        height: 10px;
        border-radius: 6px;
        background: #edf0f7;
        margin: 18px auto;
        max-width: 240px;
      }
      .screen-mobile {
        max-width: 390px;
        margin: 24px auto;
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 12px 45px #111c3508;
      }
      .mobile .topnav,
      .mobile .rail {
        display: none;
      }
      .mobile .topbar {
        height: 65px;
        padding: 0 20px;
      }
      .mobile .avatar {
        margin-left: auto;
      }
      .mobile .workspace {
        display: block;
        padding: 25px 18px;
      }
      .mobile .bread {
        margin-bottom: 22px;
      }
      .mobile .pagehead {
        align-items: center;
        margin-bottom: 23px;
      }
      .mobile h1 {
        font-size: 25px;
      }
      .mobile .pagehead .button {
        padding: 9px;
        min-width: 44px;
      }
      .mobile .pagehead .button span {
        display: none;
      }
      .mobile .hero {
        grid-template-columns: 1fr;
        padding: 23px 21px 19px;
        gap: 23px;
      }
      .mobile .hero h2 {
        font-size: 28px;
      }
      .mobile .hero p {
        font-size: 12px;
      }
      .mobile .eta {
        padding: 16px 18px;
      }
      .mobile .eta strong {
        font-size: 30px;
      }
      .mobile .eta .year {
        display: inline;
        font-size: 11px;
        margin: 0;
      }
      .mobile .eta small {
        margin-top: 8px;
      }
      .mobile .steps {
        padding: 13px 21px 22px;
        grid-template-columns: 1fr;
        gap: 0;
      }
      .mobile .steps li {
        text-align: left;
        min-height: 61px;
      }
      .mobile .stepbutton {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        column-gap: 15px;
        align-items: center;
        justify-items: start;
        min-height: 61px;
        padding: 0;
      }
      .mobile .stepicon {
        grid-row: 1/3;
        width: 36px;
        height: 36px;
        margin: 0;
      }
      .mobile .stepicon svg {
        width: 16px;
        height: 16px;
      }
      .mobile .steps b {
        max-width: none;
        font-size: 12px;
        align-self: end;
        padding-bottom: 2px;
      }
      .mobile .steps small {
        font-size: 9px;
        align-self: start;
        margin: 1px 0 0;
        min-height: 0;
      }
      .mobile .steps li::after {
        left: 17px;
        top: 49px;
        bottom: -12px;
        right: auto;
        width: 2px;
        height: auto;
        transform-origin: center top;
      }
      .mobile .contextstrip {
        padding: 17px 20px;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      .mobile .contextstrip .resetstep {
        grid-column: 2;
        padding: 0;
        min-height: 30px;
        justify-self: start;
      }
      .mobile .contextstrip strong {
        font-size: 12px;
      }
      .mobile .contextstrip p {
        font-size: 11px;
      }
      .mobile .readtime {
        flex-direction: column;
        gap: 3px;
        padding: 12px 2px 0;
      }
      .mobile .columns {
        grid-template-columns: 1fr;
        gap: 17px;
        margin-top: 22px;
      }
      .mobile .cardbody {
        padding: 22px;
      }
      .mobile .foot {
        flex-direction: column;
        font-size: 10px;
      }
      .hidden {
        display: none !important;
      }
      @media (hover: hover) {
        .stepbutton:hover .stepicon {
          transform: translateY(-3px);
          border-color: #9eafff;
          background: #f0f3ff;
        }
        .steps .current .stepbutton:hover .stepicon {
          background: var(--blue);
        }
        .button:hover {
          background: #f7f9ff;
          border-color: #b6c3ef;
          transform: translateY(-1px);
        }
        .button.primary:hover {
          background: #1030de;
        }
        .controlbutton:hover {
          background: #eef1f7;
        }
        .rail a:hover {
          background: #f7f8fc;
        }
      }
      @keyframes connect {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes connectVertical {
        from {
          transform: scaleY(0);
        }
        to {
          transform: scaleY(1);
        }
      }
      @keyframes nodeIn {
        from {
          opacity: 0.35;
          transform: translateY(5px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes currentRing {
        0% {
          transform: scale(0.95);
          opacity: 0.8;
        }
        100% {
          transform: scale(1.22);
          opacity: 0;
        }
      }
      .motion-run .steps .done::after {
        animation: connect 480ms var(--ease) both;

        },
        multi: {
          eta: "Xem từng kiện",
          etaLabel: "Thời gian nhận đủ đơn",
          notice:
            "Đơn có 2 kiện: 1 kiện đã giao, 1 kiện đang vận chuyển. Thời gian nhận đủ đơn chưa được xác nhận.",
          multi: true,
        },
        failed: {
          title: "Giao kiện chưa thành công",
          description:
            "Lần giao gần nhất chưa thành công. Chưa có lịch giao lại được xác nhận.",
          eta: "Cần cập nhật",
          etaLabel: "Thời gian giao lại",
          parcel: "Giao chưa thành công",
          event: "Đã cập nhật vận chuyển",
          eventDetail: "Giao kiện chưa thành công. Chưa có thông tin lý do.",
          next: "Chờ thông tin xử lý tiếp theo",
          nextText: "Liên hệ hỗ trợ để kiểm tra phương án giao lại.",
          notice:
            "Khoảng dự kiến trước đó không còn phù hợp với trạng thái hiện tại.",
        },
        returned: {
          title: "Kiện đã trả lại",
          description:
            "Kiện đã được ghi nhận trả lại. Tình trạng xử lý của toàn bộ đơn cần được kiểm tra.",
          eta: "Chưa có dự kiến",
          etaLabel: "Thời gian nhận hàng",
          parcel: "Đã trả lại",
          event: "Đã cập nhật vận chuyển",
          eventDetail: "Kiện đã trả lại.",
          next: "Kiểm tra hướng xử lý",
          nextText: "Liên hệ hỗ trợ để xem thông tin của kiện và đơn hàng.",
          notice:
            "Kiện trả lại không tự xác nhận đơn đã hủy hoặc đã hoàn tiền.",
        },
        hold: {
          title: "Đơn đang tạm dừng xử lý",
          description:
            "Đơn đang được tạm giữ xử lý. Chưa có thông tin lý do để hiển thị.",
          eta: "Chưa xác nhận",
          etaLabel: "Thời gian nhận hàng",
          next: "Chờ tiếp tục xử lý",
          nextText: "Liên hệ hỗ trợ để kiểm tra nội dung cần giải quyết.",
          event: "Đã cập nhật tạm giữ xử lý",
          eventDetail: "Tiến trình đang tạm dừng.",
          notice: "Không hiển thị ETA chung khi đơn đang tạm giữ xử lý.",
        },
        cancelled: {
          title: "Đơn đã hủy",
          description:
            "Đơn đã dừng xử lý. Xem chi tiết đơn để kiểm tra thông tin thanh toán.",
          eta: "Không áp dụng",
          etaLabel: "Thời gian nhận hàng",
          step: -1,
          event: "Đã cập nhật đơn",
          eventDetail: "Trạng thái đơn: đã hủy.",
          next: null,
          notice: "Trạng thái đã hủy không xác nhận đã hoàn tiền.",
          parcel: "Không hiển thị",
        },
        delivered: {
          title: "Đã giao hàng",
          description: "Đơn đã được ghi nhận giao hàng.",
          eta: "09 thg 10",
          etaLabel: "Ngày giao đã ghi nhận",
          step: 5,
          event: "Đã cập nhật vận chuyển",
          eventDetail: "Đơn đã được ghi nhận giao hàng.",
          parcel: "Kiện đã giao",
          next: null,
        },
        partial: {
          eta: "Chưa xác nhận",
          etaLabel: "Thời gian nhận đủ đơn",
          notice:
            "Thông tin kiện chưa đầy đủ. Chưa thể xác nhận thời gian nhận đủ đơn.",
          partial: true,
        },
        loading: { special: "Đang tải tiến trình đơn hàng…" },
        error: {
          special: "Chưa tải được tiến trình đơn hàng",
          detail: "Kiểm tra kết nối và thử lại.",
          retry: true,
        },
        unauthorized: {
          special: "Phiên đăng nhập đã thay đổi",
          detail: "Mở lại đơn hàng trong tài khoản của bạn.",
          account: true,
        },
        empty: {
          special: "Chưa có đơn hàng nào",
          detail: "Các đơn của bạn sẽ xuất hiện tại đây.",
        },
      };
      const steps = [
        "Thanh toán ban đầu",
        "Mua hàng",
        "Kho & đóng gói",
        "Chốt chi phí còn lại",
        "Vận chuyển",
        "Giao hàng",
      ];
      const stepIcons = ["card", "bag", "box", "card", "truck", "home"];
      const descriptions = [
        "Khoản thanh toán ban đầu được ghi nhận trước bước mua hàng.",
        "Hàng được mua từ cửa hàng theo đơn đã xác nhận.",
        "Hàng được nhận tại kho nguồn để kiểm tra và đóng gói.",
        "Chi phí còn lại được chốt trước khi xuất gửi.",
        "Hàng đã xuất gửi. Tuyến vận chuyển không phải vị trí hiện tại của kiện.",
        "Đơn được ghi nhận giao hàng. Thời gian dự kiến không phải thời điểm đã giao.",
      ];
      const observed = "2026-10-09T10:00:00+07:00";
      function stepTimes(d) {
        const dates = [
          "2026-10-04T09:30:00+07:00",
          "2026-10-05T14:05:00+07:00",
          "2026-10-08T16:40:00+07:00",
          "2026-10-08T17:10:00+07:00",
          "2026-10-09T09:15:00+07:00",
          null,
        ];
        if (d.step === 2) dates[2] = "2026-10-09T09:15:00+07:00";
        if (d.step === 5) {
          dates[4] = "2026-10-09T08:00:00+07:00";
          dates[5] = "2026-10-09T09:15:00+07:00";
        }
        return dates.map((date, i) => (i <= d.step ? date : null));
      }
      function stamp(value, className = "") {
        if (!value)
          return (
            '<span class="' +
            className +
            ' time-pending">Chưa có cập nhật</span>'
          );
        const date = new Date(value);
        const day = new Intl.DateTimeFormat("vi-VN", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          timeZone: "Asia/Ho_Chi_Minh",
        }).format(date);
        const hour = new Intl.DateTimeFormat("vi-VN", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "Asia/Ho_Chi_Minh",
        }).format(date);
        return (
          '<time class="' +
          className +
          '" datetime="' +
          value +
          '"><span class="stepdate">' +
          day +
          '</span><span class="stephour">' +
          hour +
          "</span></time>"
        );
      }
      function parcel(d) {
        if (d.step === -1 || d.step === 2 || d.partial)
          return (
            '<div class="subnote">' +
            (d.partial
              ? "Thông tin kiện chưa đầy đủ."
              : d.step === 2
                ? "Chưa có kiện được phân bổ."
                : "Không hiển thị hành trình giao cho đơn đã hủy.") +
            "</div>"
          );
        return (
          (d.multi
            ? '<article class="parcel"><h3>Kiện 01 <span class="tag">Kiện đã giao</span></h3><p>Ghi nhận: <time datetime="2026-10-08T15:20:00+07:00">08/10/2026 · 15:20</time></p></article>'
            : "") +
          '<article class="parcel"><h3>Kiện ' +
          (d.multi ? "02" : "01") +
          ' <span class="tag">' +
          d.parcel +
          '</span></h3><dl><dt>Tuyến giao</dt><dd>Nhật Bản → Việt Nam</dd><dt>Vị trí hiện tại</dt><dd>Chưa có dữ liệu vị trí</dd><dt>Mã vận đơn</dt><dd>Chưa được cập nhật</dd><dt>Cập nhật</dt><dd><time datetime="2026-10-09T09:15:00+07:00">09/10/2026 · 09:15</time></dd></dl>' +
          (d.multi
            ? "<p>Chưa có thời gian giao dự kiến cho kiện này.</p>"
            : "") +
          "</article>"
        );
      }
      const content = document.querySelector("#content");
      const screen = document.querySelector("#screen");
      const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");
      let selectedStep = null;
      let currentData = null;
      function reduced() {
        return (
          motionPreference.matches || document.body.dataset.reduce === "true"
        );
      }
      function stopMotion() {
        screen
          .getAnimations({ subtree: true })
          .forEach((animation) => animation.cancel());
        screen.classList.remove("motion-run");
      }
      function animateChange(target = content, replay = true) {
        stopMotion();
        if (reduced() || document.hidden) return;
        if (typeof target.animate === "function")
          target.animate(
            [
              { opacity: 0.65, transform: "translateY(8px)" },
              { opacity: 1, transform: "translateY(0)" },
            ],
            { duration: 320, easing: "cubic-bezier(.22,1,.36,1)" },
          );
        if (replay) {
          // Restart only this finite sequence; cancellation never changes the selected fixture.
          void screen.offsetWidth;
          screen.classList.add("motion-run");
        }
      }
      function history(d) {
        const events = [
          {
            at: "2026-10-09T09:15:00+07:00",
            title: d.event,
            detail: d.eventDetail,
          },
        ];
        if (d.step === 5)
          events.push({
            at: "2026-10-09T08:00:00+07:00",
            title: "Đã xuất gửi",
            detail: "Tuyến Nhật Bản → Việt Nam.",
          });
        if (d.step !== -1) {
          if (d.step > 2)
            events.push(
              {
                at: "2026-10-08T17:10:00+07:00",
                title: "Đã chốt chi phí còn lại",
                detail: "Ghi nhận chốt chi phí trước khi xuất gửi.",
              },
              {
                at: "2026-10-08T16:40:00+07:00",
                title: "Đã ghi nhận đóng gói",
                detail: "Hàng đã được kiểm tra và đóng gói.",
              },
              {
                at: "2026-10-07T11:20:00+07:00",
                title: "Đã nhận hàng tại kho",
                detail: "Đã nhận hàng tại kho nguồn.",
              },
            );
          events.push(
            {
              at: "2026-10-05T14:05:00+07:00",
              title: "Đã ghi nhận mua hàng",
              detail: "Đã mua hàng từ cửa hàng.",
            },
            {
              at: "2026-10-04T09:30:00+07:00",
              title: "Đã ghi nhận thanh toán ban đầu",
              detail: "Khoản thanh toán ban đầu đã được ghi nhận.",
            },
          );
        }
        return events
          .map(
            (event, i) =>
              '<li class="' +
              (i === 0 ? "latest" : "") +
              '" style="--i:' +
              i +
              '">' +
              stamp(event.at, "eventtime") +
              '<div class="entry"><b>' +
              event.title +
              "</b><p>" +
              event.detail +
              "</p></div></li>",
          )
          .join("");
      }
      function render() {
        stopMotion();
        const key = document.querySelector("#scenario").value;
        const d = { ...scenarios.transit, ...scenarios[key] };
        currentData = d;
        selectedStep = null;
        if (d.special) {
          content.innerHTML =
            '<section class="panel empty">' +
            icon("box") +
            "<h2>" +
            d.special +
            "</h2>" +
            (key === "loading" ? '<div class="loadingbar"></div>' : "") +
            "<p>" +
            (d.detail || "") +
            "</p>" +
            (d.retry
              ? '<button class="button primary" id="retry">Tải lại tiến trình</button>'
              : "") +
            (d.account
              ? '<a class="button" href="/account">Mở tài khoản</a>'
              : "") +
            "</section>";
          document.querySelector("#retry")?.addEventListener("click", () => {
            document.querySelector("#scenario").value = "transit";
            render();
            document
              .querySelector(".steps .current .stepbutton")
              ?.focus({ preventScroll: true });
          });
          animateChange();
          return;
        }
        const times = stepTimes(d);
        const chart =
          d.step === -1
            ? ""
            : '<div class="timelineheading"><span>Thời điểm cập nhật từng mốc</span><span>Giờ Việt Nam · UTC+7</span></div><ol class="steps" aria-label="Các mốc đơn hàng — giờ Việt Nam UTC+7">' +
              steps
                .map((step, i) => {
                  const state =
                    i < d.step ? "done" : i === d.step ? "current" : "next";
                  const stateLabel =
                    i < d.step
                      ? "Đã qua bước này"
                      : i === d.step
                        ? key === "hold"
                          ? "Tạm dừng"
                          : d.step === 5
                            ? "Đã giao"
                            : "Hiện tại"
                        : "Chưa đến bước này";
                  return (
                    '<li class="' +
                    state +
                    '" style="--i:' +
                    i +
                    '" ' +
                    (i === d.step ? 'aria-current="step"' : "") +
                    '><div class="stepbutton" data-step="' +
                    i +
                    '" aria-label="' +
                    step +
                    " — " +
                    stateLabel +
                    " — " +
                    (times[i]
                      ? new Intl.DateTimeFormat("vi-VN", {
                          dateStyle: "short",
                          timeStyle: "short",
                          timeZone: "Asia/Ho_Chi_Minh",
                        }).format(new Date(times[i])) + " UTC+7"
                      : "Chưa có cập nhật") +
                    '"><span class="stepicon">' +
                    icon(i < d.step ? "check" : stepIcons[i]) +
                    "</span><b>" +
                    step +
                    "</b><small>" +
                    (i === d.step
                      ? stateLabel
                      : i === d.step + 1
                        ? "Tiếp theo"
                        : "") +
                    "</small>" +
                    stamp(times[i], "steptime") +
                    "</div></li>"
                  );
                })
                .join("") +
              "</ol>";
        const etaNote =
          key === "transit"
            ? "Ước tính của nhân viên, có thể thay đổi."
            : key === "late"
              ? "Ước tính trước đó: 06 – 08/10/2026."
              : key === "delivered"
                ? "Theo cập nhật đã ghi nhận."
                : "Theo thông tin hiện có của đơn.";
        content.innerHTML =
          '<section class="panel tracking-panel"><div class="hero"><div class="hero-main"><div class="status">' +
          (d.step === -1
            ? "Đã dừng xử lý"
            : d.step === 5
              ? "Đã ghi nhận giao"
              : key === "hold"
                ? "Tạm dừng xử lý"
                : "Đơn hàng của bạn") +
          "</div><h2>" +
          d.title +
          "</h2><p>" +
          d.description +
          '</p><div class="route"><span class="country">JP</span>Nhật Bản ' +
          icon("arrow") +
          '<span class="country">VN</span> Việt Nam</div></div><div class="eta"><span class="eta-title">' +
          icon("calendar") +
          d.etaLabel +
          "</span><strong>" +
          d.eta +
          "</strong>" +
          (key === "transit" || key === "delivered"
            ? '<span class="year">2026</span>'
            : "") +
          "<small>" +
          etaNote +
          "</small></div></div>" +
          chart +
          '</section><p class="readtime"><span>' +
          icon("clock") +
          'Giờ Việt Nam (UTC+7) · Dữ liệu minh họa</span><span>Đọc lúc <time datetime="' +
          observed +
          '">09/10/2026 · 10:00</time> · Không trực tiếp</span></p>' +
          (d.notice
            ? '<div class="notice" role="status"><b>' +
              (d.late
                ? "Cần cập nhật lịch giao"
                : d.multi
                  ? "Đơn chưa giao đủ"
                  : "Thông tin cần lưu ý") +
              "</b>" +
              d.notice +
              "</div>"
            : "") +
          '<div class="columns"><section class="panel cardbody"><div class="sectionhead"><h2>Lịch sử cập nhật</h2><span class="tag">Mới nhất trước</span></div><ol class="events">' +
          history(d) +
          '</ol></section><section class="panel cardbody"><div class="sectionhead"><h2>Kiện vận chuyển</h2><span class="tag">' +
          (d.multi
            ? "2 kiện"
            : d.partial
              ? "Chưa đầy đủ"
              : d.step === 2 || d.step === -1
                ? "Chưa hiển thị"
                : "1 kiện") +
          "</span></div>" +
          parcel(d) +
          '<div class="subnote">' +
          (d.multi
            ? "Một kiện đã giao chưa có nghĩa toàn bộ đơn đã giao đủ."
            : "Thông tin vận chuyển được nhân viên ghi nhận. Vị trí chỉ hiển thị khi có dữ liệu.") +
          '</div><div class="product"><div class="producticon">' +
          icon("box") +
          "</div><div><b>Sản phẩm trong đơn</b><small>2 sản phẩm · Mua hộ Nhật Bản</small></div></div></section></div>";

        animateChange();
      }
      document.querySelector("#scenario").addEventListener("change", render);
      for (const mode of ["desktop", "mobile"])
        document.querySelector("#" + mode).addEventListener("click", () => {
          stopMotion();
          screen.className = mode === "mobile" ? "screen-mobile mobile" : "";
          document
            .querySelector("#desktop")
            .setAttribute("aria-pressed", String(mode === "desktop"));
          document
            .querySelector("#mobile")
            .setAttribute("aria-pressed", String(mode === "mobile"));
          animateChange(screen);
        });
      document
        .querySelector("#replay")
        .addEventListener("click", () => animateChange());
      document.querySelector("#reduce").addEventListener("click", () => {
        const enabled = document.body.dataset.reduce !== "true";
        document.body.dataset.reduce = String(enabled);
        document
          .querySelector("#reduce")
          .setAttribute("aria-pressed", String(enabled));
        stopMotion();
      });
      motionPreference.addEventListener("change", stopMotion);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopMotion();
      });
      window.addEventListener("pagehide", stopMotion);
      render();
    </script>
  </body>
</html>
