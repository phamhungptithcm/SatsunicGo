<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SatsunicGo · Chọn phương thức thanh toán</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f8f9fc; color: #111c35; font: 15px/1.5 Arial, sans-serif; }
      main { width: min(100% - 40px, 680px); margin: 56px auto; }
      .brand { margin: 0 0 32px; font-size: 21px; font-weight: 750; letter-spacing: -.7px; }
      .brand span { color: #163cff; }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.6px; }
      .lead { margin: 0 0 24px; color: #647087; font-size: 14px; }
      .card { padding: 24px; background: #fff; border: 1px solid #e2e7f0; border-radius: 16px; }
      fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
      legend { margin-bottom: 18px; padding: 0; font-size: 17px; font-weight: 700; }
      .methods { display: grid; gap: 10px; }
      .method { display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 16px; border: 1px solid #e1e6ef; border-radius: 12px; }
      .method.selected { background: #f5f7ff; border-color: #163cff; }
      .method.unavailable { background: #fafbfd; }
      .icon { display: grid; place-items: center; flex: 0 0 42px; height: 42px; border: 1px solid #e4e9f4; border-radius: 10px; background: #fff; color: #163cff; }
      .unavailable .icon { color: #7b879a; }
      svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .copy { min-width: 0; flex: 1; }
      .title { display: block; font-size: 14px; font-weight: 600; }
      .description { display: block; margin-top: 3px; font-size: 12px; color: #647087; }
      .unavailable .title { color: #556176; }
      .status { display: inline-block; margin-top: 5px; color: #707c8f; font-size: 11px; }
      input[type=radio] { flex: 0 0 18px; width: 18px; height: 18px; margin: 0; accent-color: #163cff; }
      .method:focus-within { outline: 2px solid #163cff; outline-offset: 3px; }
      .note { display: flex; align-items: flex-start; gap: 8px; margin: 18px 0 0; font-size: 12px; color: #647087; }
      .note svg { flex: 0 0 16px; width: 16px; height: 16px; margin-top: 1px; }
      .preview { margin: 16px 0 0; font-size: 12px; color: #647087; }
      @media (max-width: 480px) {
        main { width: calc(100% - 32px); margin: 28px auto; }
        .brand { margin-bottom: 24px; }
        h1 { font-size: 24px; }
        .card { padding: 18px; }
        .method { gap: 10px; padding: 12px; }
        .icon { flex-basis: 36px; height: 36px; }
        .title { font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Satsunic<span>Go</span></p>
      <h1>Tổng quan đơn hàng</h1>
      <p class="lead">Phần chọn phương thức nằm trước bước xác nhận thanh toán.</p>
      <section class="card" aria-label="Chọn phương thức thanh toán">
        <fieldset aria-describedby="payment-note">
          <legend>Phương thức thanh toán</legend>
          <div class="methods">
            <label class="method selected">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9h18M4 9V7l8-4 8 4v2M5 20h14M3 21h18M6 12v5M10 12v5M14 12v5M18 12v5" /></svg></span>
              <span class="copy"><span class="title">QR chuyển khoản ngân hàng</span><span class="description">Quét mã bằng ứng dụng ngân hàng.</span></span>
              <input type="radio" name="payment-method" value="BANK_TRANSFER" checked aria-label="QR chuyển khoản ngân hàng" />
            </label>
            <label class="method unavailable">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h2v2h-2zM21 15v6h-6M12 3v3M3 12h3M12 12h3M12 18v3M18 12h3" /></svg></span>
              <span class="copy"><span class="title">QR NAPAS chuyển khoản</span><span class="status">Chưa khả dụng</span></span>
              <input type="radio" name="payment-method" value="NAPAS_BANK_TRANSFER" disabled aria-label="QR NAPAS chuyển khoản, chưa khả dụng" />
            </label>
            <label class="method unavailable">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M3 10h18M7 15h4" /></svg></span>
              <span class="copy"><span class="title">Thẻ ngân hàng</span><span class="description">Visa, Mastercard, JCB</span><span class="status">Chưa khả dụng</span></span>
              <input type="radio" name="payment-method" value="CARD" disabled aria-label="Thẻ ngân hàng, chưa khả dụng" />
            </label>
          </div>
        </fieldset>
        <p class="note" id="payment-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4v5c0 5-8 9-8 9s-8-4-8-9V7zM8 12l3 3 5-6" /></svg>Bạn sẽ tiếp tục thanh toán qua SePay sau khi xác nhận đơn hàng.</p>
      </section>
      <p class="preview">Bản xem trước bố cục · chưa kết nối SePay, không tạo đơn hoặc giao dịch.</p>
    </main>
  </body>
</html>
