<body>
<main class="shell" id="shell" aria-label="Hỏi SatsunicGo">
  <header class="top">
    <div class="brand">Satsunic<span>Go</span></div>
    <nav aria-label="Điều khiển hội thoại" id="controls">
      <div class="history-wrap">
        <button type="button" class="icon" id="history-toggle" aria-label="Lịch sử hội thoại" title="Lịch sử hội thoại" aria-expanded="false" aria-controls="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3.5 10a8.5 8.5 0 1 1 1.2 6.5M3.5 4.5V10H9M12 7v5l3.3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <section class="history" id="history" aria-labelledby="history-title" hidden>
          <h2 id="history-title">Hội thoại gần đây</h2>
          <button type="button" id="history-current">Áo thun AIRism<small id="history-current-detail">Lựa chọn hiện tại</small></button>
          <button type="button" id="history-old">Phí vận chuyển từ Nhật<small id="history-old-detail">Chỉ xem lại</small></button>
        </section>
      </div>
      <div class="language" id="languages" aria-label="Ngôn ngữ">
        <button class="lang" type="button" data-lang="vi" aria-pressed="true" aria-label="Tiếng Việt">VI</button>
        <button class="lang" type="button" data-lang="en" aria-pressed="false" aria-label="English">EN</button>
      </div>
      <button type="button" class="icon" id="close-chat" aria-label="Đóng hội thoại" title="Đóng hội thoại"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg></button>
    </nav>
  </header>
  <div class="stream" id="stream" tabindex="-1">
    <div class="reading">
      <div class="history-note" id="history-note" hidden><span id="history-notice"></span><button class="text-button" id="return-current" type="button"></button></div>
      <div id="current-view">
        <section class="turn">
          <div class="question"><p id="initial-question"></p></div>
          <div class="answer"><p id="initial-answer"></p></div>
        </section>
        <section class="turn" id="selection-turn">
          <div class="question"><p id="selection-question"></p></div>
          <div class="answer"><p id="selection-answer"></p></div>
          <section class="review" id="review" aria-labelledby="product-title">
            <h2 id="product-title">Áo thun AIRism</h2>
            <p class="variant" id="variant-line"></p>
            <div class="detail-row"><span id="unit-label"></span><strong id="unit-value"></strong></div>
            <div class="detail-row total"><span id="total-label"></span><strong id="total-value"></strong></div>
            <p class="notes" id="review-notes" hidden></p>
            <details><summary id="terms-label"></summary><p id="terms-value"></p></details>
            <p class="consequence" id="consequence"></p>
            <p class="review-status" id="review-status" role="status" aria-live="polite"></p>
            <div class="review-actions"><button type="button" class="primary" id="confirm"></button><button type="button" class="text-button" id="edit"></button></div>
            <p class="reply-hint" id="reply-hint"></p>
          </section>
        </section>
        <div id="followups" role="log" aria-label="Tin nhắn mới" aria-live="polite" aria-relevant="additions"></div>
      </div>
      <section class="history-turn" id="old-view" hidden tabindex="-1"><h2 id="old-title"></h2><div class="question"><p id="old-question"></p></div><div class="answer"><p id="old-answer"></p></div></section>
    </div>
  </div>
  <footer class="bottom">
    <form class="composer" id="composer"><label for="message" class="sr" id="message-label"></label><textarea id="message" rows="1" maxlength="1200" aria-describedby="privacy"></textarea><button class="send" type="submit" id="send" disabled aria-label="Gửi tin nhắn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 18V5m-5 5 5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>
    <p class="privacy" id="privacy" hidden></p>
  </footer>
</main>
<div class="return-shell" id="closed" hidden><button type="button" class="primary" id="reopen"></button></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title" aria-describedby="sheet-help">
  <form id="edit-form">
    <header class="sheet-head"><h2 id="sheet-title"></h2><button class="icon" type="button" id="close-sheet" aria-label="Về hội thoại"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg></button></header>
    <div class="sheet-body">
      <p id="sheet-help"></p>
      <label class="field"><span id="product-label"></span><input id="product" readonly value="Áo thun AIRism"></label>
      <label class="field"><span id="colour-label"></span><select id="colour"><option value="white"></option><option value="black"></option></select></label>
      <label class="field"><span id="size-label"></span><select id="size"><option>M</option><option>L</option><option>XL</option></select></label>
      <label class="field"><span id="quantity-label"></span><input id="quantity" type="number" inputmode="numeric" min="1" max="30" step="1" required value="2" aria-describedby="quantity-help"><small id="quantity-help"></small></label>
      <label class="field"><span id="notes-label"></span><textarea id="notes" rows="4" maxlength="600"></textarea><small id="notes-help"></small></label>
      <p class="draft-notice" id="draft-notice" role="status"></p>
    </div>
    <footer class="sheet-footer"><button type="button" class="text-button" id="back-chat"></button><button type="submit" class="primary" id="review-again"></button></footer>
  </form>
</dialog>

      historyNotice:'You are reading history. Confirmation is unavailable here.',returnCurrent:'Return to current conversation',oldTitle:'Shipping from Japan',oldQuestion:'How is shipping from Japan calculated?',oldAnswer:'The charge depends on the route and weight. Review your order’s quote for the amount that applies.',historyBlocked:'Return to the current conversation to edit or confirm.',mixed:'Your selection changed. Review the details and total again before confirming.',generic:'Ask another question, or choose “Edit” to change the variant and quantity.',pendingReply:'The earlier outcome has not been verified. Check it before sending another request.'
    }
  };
  const state = {lang:new URLSearchParams(location.search).get('lang') === 'en'?'en':'vi',mode:'review',readiness:'ready',history:false,revision:1,rendered:0,selection:{colour:'white',size:'M',quantity:2,notes:''},preview:null,messages:[],operation:null,attempts:0,sheetReturn:null,readingPosition:0};
  const seenDetails = new Set();
  let loadTicket=0;
  const t = key => copy[state.lang][key];
  const money = value => new Intl.NumberFormat(state.lang==='vi'?'vi-VN':'en-US',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(value);
  const setText = (id,key) => {$(id).textContent=t(key);};
  const validQuantity = selection => Number.isInteger(selection.quantity)&&selection.quantity>=1&&selection.quantity<=30;
  function snapshot(){return Object.freeze({...state.selection,unit:490000,total:490000*state.selection.quantity,revision:state.revision});}
  function review(){if(state.operation||state.history||state.readiness!=='ready')return false;if(!validQuantity(state.selection)){openSheet();return false;}state.mode='review';state.preview=snapshot();state.rendered=0;seenDetails.clear();render();const captured=state.preview;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(state.preview===captured)updateRendered();}));return true;}
  function invalidate(){state.revision++;state.rendered=0;seenDetails.clear();state.preview=null;if(!state.operation)state.mode=state.readiness==='ready'?'stale':state.readiness;}
  function visible(node){const r=node.getBoundingClientRect(),pane=$('stream').getBoundingClientRect();if(!r.width||!r.height)return false;const width=Math.max(0,Math.min(r.right,pane.right)-Math.max(r.left,pane.left)),height=Math.max(0,Math.min(r.bottom,pane.bottom)-Math.max(r.top,pane.top));return width*height/(r.width*r.height)>=.95;}
  function updateRendered(){
    if(!state.preview||state.preview.revision!==state.revision||state.mode!=='review'||state.readiness!=='ready'||state.history||$('sheet').open||$('shell').hidden){state.rendered=0;return;}
    const required=['product-title','variant-line','unit-value','total-value','terms-label','consequence','confirm'];
    required.forEach(id=>{if(visible($(id)))seenDetails.add(id);});
    state.rendered=required.every(id=>seenDetails.has(id))&&visible($('confirm'))?state.revision:0;
  }
  function variant(selection){return `${t(selection.colour)} · ${selection.size} · ${validQuantity(selection)?`${selection.quantity} ${state.lang==='vi'?'áo':selection.quantity===1?'shirt':'shirts'}`:t('invalidQuantity')}`;}
  function render(){
    document.documentElement.lang=state.lang;
    $('shell').setAttribute('aria-label',t('shell'));$('controls').setAttribute('aria-label',t('controls'));$('languages').setAttribute('aria-label',t('language'));
    for(const [id,key] of Object.entries({'history-title':'historyTitle','history-current-detail':'currentDetail','history-old-detail':'oldDetail','initial-question':'initialQuestion','initial-answer':'initialAnswer','selection-question':'selectionQuestion','selection-answer':'selectionAnswer','product-title':'product','unit-label':'unit','total-label':'total','terms-label':'terms','terms-value':'termsValue','consequence':'consequence','message-label':'message','privacy':'privacy','sheet-title':'sheetTitle','sheet-help':'sheetHelp','product-label':'productLabel','colour-label':'colourLabel','size-label':'sizeLabel','quantity-label':'quantityLabel','quantity-help':'quantityHelp','notes-label':'notesLabel','notes-help':'notesHelp','draft-notice':'draftNotice','back-chat':'back','review-again':'reviewAgain','history-notice':'historyNotice','return-current':'returnCurrent','old-title':'oldTitle','old-question':'oldQuestion','old-answer':'oldAnswer','reopen':'reopen'}))setText(id,key);
    $('history-current').firstChild.textContent=t('currentItem');$('history-old').firstChild.textContent=t('oldItem');
    for(const id of ['history-toggle','close-chat','close-sheet','send']){const key={'history-toggle':'history','close-chat':'close','close-sheet':'back',send:'send'}[id];$(id).setAttribute('aria-label',t(key));$(id).title=t(key);}
    $('message').placeholder=t('placeholder');$('followups').setAttribute('aria-label',t('log'));$('product').value=t('product');
    document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang)));
    $('colour').options[0].textContent=t('white');$('colour').options[1].textContent=t('black');
    const shown = state.operation?.selection||state.preview||state.selection;
    $('variant-line').textContent=variant(shown);$('unit-value').textContent=money(490000);$('total-value').textContent=validQuantity(shown)?money(490000*shown.quantity):t('unknownTotal');
    $('review-notes').textContent=shown.notes;$('review-notes').hidden=!shown.notes;
    let status='',label='confirm';
    if(state.mode==='stale'){status=t('stale');label='reviewAgain';}
    else if(state.mode==='not-sent'){status=t('notSent');label='notSentButton';}
    else if(state.mode==='unknown'){status=t('unknown');label='reconcile';}
    else if(state.mode==='reconciling'){status=t('reconciling');label='reconcile';}
    else if(state.mode==='unavailable'){status=t('unavailable');label='retryLoad';}
    else if(state.mode==='signed-out'){status=t('signedOut');label='signIn';}
    else if(state.mode==='loading'){status=t('loading');label='reviewAgain';}
    else if(state.mode==='empty'){status=t('empty');}
    $('review-status').textContent=status;$('confirm').textContent=t(label);
    $('confirm').disabled=state.history||['not-sent','reconciling','loading'].includes(state.mode);
    $('edit').textContent=t('edit');$('edit').setAttribute('aria-label',t('editName'));$('edit').disabled=!!state.operation||state.history||['loading','signed-out'].includes(state.mode);
    $('reply-hint').textContent=t('hint');$('reply-hint').hidden=state.mode!=='review'||state.history;
    $('review').hidden=state.mode==='empty';$('initial-question').closest('.turn').hidden=state.mode==='empty';$('selection-question').closest('.question').hidden=state.mode==='empty';$('selection-answer').textContent=state.mode==='empty'?t('empty'):t('selectionAnswer');
    $('current-view').hidden=state.history;$('old-view').hidden=!state.history;$('history-note').hidden=!state.history;
    $('message').disabled=state.history;$('send').disabled=state.history||!$('message').value.trim();
    state.messages.forEach((message,index)=>{let section=$('followups').children[index];if(!section){section=document.createElement('section');section.className='turn followup';const question=document.createElement('div');question.className='question';const q=document.createElement('p');q.textContent=message.text;question.append(q);const answer=document.createElement('div');answer.className='answer';answer.append(document.createElement('p'));section.append(question,answer);$('followups').append(section);}section.querySelector('.answer p').textContent=t(message.key);});
  }
  function latest(){requestAnimationFrame(()=>$('stream').scrollTo({top:$('stream').scrollHeight,behavior:'instant'}));}
  function revealReview(initial=false){requestAnimationFrame(()=>{
    if($('review').hidden||state.history||$('shell').hidden)return;
    if(initial){
      const pane=$('stream'),reading=document.querySelector('.reading');
      reading.style.paddingBottom='0px';
      const available=pane.clientHeight;
      const candidates=[$('selection-turn'),$('review'),$('unit-label').closest('.detail-row'),$('total-label').closest('.detail-row'),$('consequence'),document.querySelector('.review-actions')];
      const bottom=$('review').getBoundingClientRect().bottom;
      const target=candidates.find(node=>bottom-node.getBoundingClientRect().top<=available-8)||candidates.at(-1);
      const top=target.getBoundingClientRect().top-pane.getBoundingClientRect().top+pane.scrollTop-pane.clientTop;
      const extra=Math.max(0,top-(pane.scrollHeight-pane.clientHeight));
      reading.style.paddingBottom=`${Math.ceil(extra)}px`;
      pane.scrollTo({top,behavior:'instant'});
    }else $('review').scrollIntoView({block:'nearest',behavior:'instant'});
    updateRendered();
  });}
  function addMessage(text,key){state.messages.push({text,key});render();latest();}
  function confirm(){
    updateRendered();
    if(state.history||$('sheet').open)return;
    if(state.operation){if(state.mode!=='reconciling'){const pending=state.operation;state.mode='reconciling';render();setTimeout(()=>{if(state.operation!==pending)return;state.mode='unknown';render();$('review-status').textContent=t('stillUnknown');},550);}return;}
    if(state.mode==='signed-out'){ $('review-status').textContent=t('signInUnavailable');return; }
    if(state.mode==='unavailable'){const ticket=++loadTicket;state.mode='loading';state.readiness='loading';render();setTimeout(()=>{if(ticket!==loadTicket||state.readiness!=='loading')return;state.readiness='ready';invalidate();render();if(review())revealReview();},450);return;}
    if(state.mode!=='review'||!state.preview||state.rendered!==state.revision){review();revealReview();return;}
    state.mode='not-sent';state.attempts++;render();
  }
  function closeHistory(){ $('history').hidden=true;$('history-toggle').setAttribute('aria-expanded','false'); }
  function openSheet(){
    if(state.operation||state.history)return;
    state.sheetReturn=document.activeElement;invalidate();render();
    $('colour').value=state.selection.colour;$('size').value=state.selection.size;$('quantity').value=Number.isFinite(state.selection.quantity)?state.selection.quantity:'';$('notes').value=state.selection.notes;
    $('sheet').showModal();$('colour').focus({preventScroll:true});
  }
  function closeSheet(){if(!$('sheet').open)return;$('sheet').close();render();requestAnimationFrame(()=>{const target=state.sheetReturn;target?.isConnected&&!target.disabled?target.focus({preventScroll:true}):$('message').focus({preventScroll:true});});}
  $('edit').addEventListener('click',openSheet);
  $('confirm').addEventListener('click',confirm);
  $('close-sheet').addEventListener('click',closeSheet);$('back-chat').addEventListener('click',closeSheet);
  $('sheet').addEventListener('cancel',event=>{event.preventDefault();closeSheet();});
  $('edit-form').addEventListener('input',()=>{state.selection={colour:$('colour').value,size:$('size').value,quantity:$('quantity').valueAsNumber,notes:$('notes').value};state.preview=null;state.rendered=0;});
  $('edit-form').addEventListener('submit',event=>{event.preventDefault();if(!$('edit-form').reportValidity())return;state.revision++;$('sheet').close();review();revealReview();requestAnimationFrame(()=>$('confirm').focus({preventScroll:true}));});
  $('history-toggle').addEventListener('click',()=>{const next=$('history').hidden;$('history').hidden=!next;$('history-toggle').setAttribute('aria-expanded',String(next));if(next)$('history-current').focus();});
  $('history-old').addEventListener('click',()=>{closeHistory();state.readingPosition=$('stream').scrollTop;invalidate();state.history=true;render();requestAnimationFrame(()=>$('old-view').focus());});
  function returnCurrent(){closeHistory();state.history=false;render();requestAnimationFrame(()=>{$('stream').scrollTop=state.readingPosition;$('message').focus({preventScroll:true});});}
  $('history-current').addEventListener('click',returnCurrent);$('return-current').addEventListener('click',returnCurrent);
  document.addEventListener('pointerdown',event=>{if(!event.target.closest('.history-wrap'))closeHistory();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('sheet').open&&!$('history').hidden){event.preventDefault();closeHistory();$('history-toggle').focus();}});
  document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{if(state.lang===button.dataset.lang)return;state.lang=button.dataset.lang;invalidate();render();}));
  $('message').addEventListener('input',()=>{$('send').disabled=state.history||!$('message').value.trim();$('message').style.height='auto';$('message').style.height=Math.min($('message').scrollHeight,160)+'px';});
  $('message').addEventListener('focus',()=>{$('privacy').hidden=false;});
  $('message').addEventListener('blur',()=>{$('privacy').hidden=true;});
  $('message').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('composer').requestSubmit();}});
  $('composer').addEventListener('submit',event=>{
    event.preventDefault();const text=$('message').value.trim();if(!text||state.history)return;$('message').value='';$('message').style.height='auto';
    const clean=text.toLocaleLowerCase().replace(/[.!]$/,'').trim();
    if(state.operation){addMessage(text,'pendingReply');return;}
    const quantity=text.match(/(?:đổi|chon|chọn|change|make|quantity|số lượng)\D{0,15}(\d+)/iu);
    if(quantity){const value=Number(quantity[1]);if(value>=1&&value<=30){state.selection.quantity=value;invalidate();addMessage(text,'mixed');return;}}
    if(['yes','đồng ý'].includes(clean)){if(state.readiness!=='ready'){addMessage(text,{ 'signed-out':'signedOut',loading:'loading',unavailable:'unavailable'}[state.readiness]);return;}updateRendered();const fresh=state.mode==='review'&&state.preview&&state.rendered===state.revision;if(fresh){confirm();addMessage(text,'notSent');}else{review();addMessage(text,'firstReview');revealReview();}return;}
    if(['chưa','không','no','not yet'].includes(clean)){invalidate();addMessage(text,'declined');return;}
    if(/^(?:tạo đơn|xác nhận lựa chọn và tạo đơn|create product order|confirm selection and create order)$/iu.test(clean)){if(state.readiness!=='ready'){addMessage(text,{'signed-out':'signedOut',loading:'loading',unavailable:'unavailable'}[state.readiness]);return;}review();addMessage(text,'firstReview');revealReview();return;}
    addMessage(text,'generic');
  });
  $('close-chat').addEventListener('click',()=>{closeHistory();invalidate();render();$('shell').hidden=true;$('closed').hidden=false;$('reopen').focus();});
  $('reopen').addEventListener('click',()=>{$('closed').hidden=true;$('shell').hidden=false;$('message').focus({preventScroll:true});});
  window.askPreview={
    setState(mode){if(!['review','stale','unknown','loading','empty','unavailable','signed-out'].includes(mode))throw Error('Unsupported preview state');++loadTicket;state.revision++;state.history=false;state.readiness=['signed-out','loading','unavailable'].includes(mode)?mode:'ready';state.operation=mode==='unknown'?Object.freeze({id:'pending-local-1',selection:snapshot()}):null;state.mode=mode;state.rendered=0;seenDetails.clear();state.preview=mode==='review'?snapshot():null;if(mode==='review')review();else render();},
    reveal(){revealReview(true);},
    inspect(){return JSON.parse(JSON.stringify({language:state.lang,mode:state.mode,readiness:state.readiness,history:state.history,revision:state.revision,rendered:state.rendered,selection:state.selection,preview:state.preview,operation:state.operation,localSelections:state.attempts}));}
  };
  $('stream').addEventListener('scroll',updateRendered,{passive:true});window.addEventListener('resize',updateRendered);
  review();revealReview(true);
  const requested=new URLSearchParams(location.search).get('state');if(requested)window.askPreview.setState(requested);
})();
</script>
