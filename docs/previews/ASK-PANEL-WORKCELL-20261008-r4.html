<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SatsunicGo Ask</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#111c35;background:#f5f7fb;font-synthesis:none;--blue:#163cff;--border:#e2e6ef;--muted:#52617a}*{box-sizing:border-box}body{margin:0;padding:20px}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--border);border-radius:10px;background:white;padding:10px 14px;color:inherit}button:hover{background:#f5f7fb}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #163cff77;outline-offset:3px}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1030d0}.preview-bar{max-width:960px;margin:0 auto 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}.preview-bar p{font-size:12px;color:var(--muted);margin:0;max-width:690px}.preview-bar button{font-size:13px;white-space:nowrap}.panel{max-width:960px;height:min(850px,calc(100dvh - 108px));min-height:430px;margin:auto;background:white;border:1px solid var(--border);border-radius:22px;box-shadow:0 20px 80px #111c3510;display:grid;grid-template-rows:60px 56px minmax(0,1fr) auto;overflow:hidden}.header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border)}h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.4px}.mark{display:inline-grid;place-items:center;background:#edf1ff;color:var(--blue);width:30px;height:30px;border-radius:9px;margin-right:8px;font-size:19px}.header small{color:var(--muted);font-size:12px}.icon{width:44px;padding:0;border:0;font-size:23px}.waypoints{display:flex;align-items:center;gap:8px;padding:6px 16px;overflow:auto;border-bottom:1px solid var(--border);scrollbar-width:thin}.waypoints button{font-size:12px;white-space:nowrap;border:0;min-height:40px;color:var(--muted);padding:8px 10px;border-radius:8px}.waypoints button[aria-current=step]{color:var(--blue);background:#edf1ff;box-shadow:inset 0 -2px var(--blue)}.step-dot{font-size:11px;border:1px solid currentColor;border-radius:50%;padding:2px 5px;margin-right:6px}.work{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}.chat{overflow:auto;overscroll-behavior:contain;padding:24px;scrollbar-width:thin;min-width:0;line-height:1.6;font-size:15px}.turn{margin-bottom:28px;scroll-margin-top:16px}.question{max-width:88%;width:fit-content;margin:0 0 14px auto;background:#f1f3f8;border-radius:15px 15px 4px 15px;padding:10px 14px;white-space:pre-wrap}.answer{margin:0;white-space:pre-wrap}.answer strong{font-weight:650}.answer-tag{color:var(--blue);font-size:12px;margin:0 0 6px}.hint{color:var(--muted);font-size:12px;line-height:1.5;margin:8px 0}.note{background:#f5f7fb;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13px;margin:14px 0}.history-banner{position:sticky;top:-24px;z-index:2;background:#fff8e9;border:1px solid #f1d7a5;border-radius:10px;padding:10px;margin-bottom:16px;display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12px}.history-banner button{font-size:12px;padding:6px 8px;min-height:36px}.action{min-width:0;min-height:0;display:grid;grid-template-rows:58px minmax(0,1fr) auto;border-left:1px solid var(--border);background:#fafbfe}.action-header{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:8px}.action-header h2{font-size:15px;margin:0}.status{font-size:11px;color:var(--muted);display:block;margin-top:3px}.action-body{padding:18px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.action-footer{border-top:1px solid var(--border);padding:12px 16px;background:white;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.action-footer button{font-size:13px}.form-grid{display:grid;gap:16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:600}label span{color:var(--blue)}label small{font-weight:400;color:var(--muted);display:block;font-size:11px;margin-top:5px}input,select,textarea{display:block;margin-top:7px;width:100%;border:1px solid #d5dce9;border-radius:9px;background:white;padding:11px 12px;min-height:44px;color:inherit;font-size:15px}textarea{resize:vertical;min-height:96px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:10px 0 0}.error{font-size:13px;color:#a32222;margin:12px 0}.review-list{margin:0;display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:14px}.review-list dt{color:var(--muted)}.review-list dd{margin:0;overflow-wrap:anywhere}.review-title{font-size:17px;margin:0 0 20px}.consequence{border:1px solid #cbd5ff;border-radius:12px;background:#edf1ff;padding:14px;font-size:14px;line-height:1.6;margin-top:20px}.consequence p{margin:0}.composer-wrap{padding:12px 20px 16px;background:white;border-top:1px solid var(--border)}.composer{display:flex;align-items:flex-end;gap:8px;border:1px solid #ccd4e3;border-radius:18px;padding:8px 9px 8px 14px}.composer textarea{margin:0;border:0;resize:none;min-height:42px;max-height:120px;padding:9px 0;background:transparent;line-height:1.5}.composer textarea:focus-visible{outline:none}.composer:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px #163cff15}.send{width:44px;min-width:44px;border-radius:12px;font-size:20px;padding:0}.composer-hint{margin:7px 0 0;text-align:center;font-size:11px;color:var(--muted)}.task-open{display:none}.closed{display:none!important}.work.action-closed{grid-template-columns:1fr}.work.action-closed .action{display:none}.work.action-closed .task-open{display:inline-flex}.empty-action{font-size:14px;line-height:1.6;color:var(--muted)}[hidden]{display:none!important}@media(max-width:759px){body{padding:8px}.preview-bar{margin-bottom:8px;gap:6px}.preview-bar p{font-size:10px}.preview-bar button{min-height:36px;padding:6px 9px}.panel{height:calc(100dvh - 76px);min-height:400px;border-radius:16px;grid-template-rows:56px 52px minmax(0,1fr) auto}.header{padding:0 12px}.header small{display:none}.work{grid-template-columns:1fr}.work .chat{display:none}.work.action-closed .chat{display:block}.work.action-closed .action{display:none}.action{border-left:0}.action-body{padding:16px}.chat{padding:18px}.composer-wrap{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.pair{grid-template-columns:1fr}.waypoints{padding-left:8px}.action-header{padding:8px 12px}.history-banner{top:-18px}.task-open{display:inline-flex}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<div class="preview-bar"><p id="disclosure"></p><button id="language" type="button">English</button></div>
<main class="panel" aria-label="SatsunicGo Ask">
 <header class="header"><h1><span class="mark" aria-hidden="true">✦</span>SatsunicGo Ask</h1><small id="header-hint"></small><button class="icon" id="restart" type="button" aria-label="Bắt đầu lại">↺</button></header>
 <nav class="waypoints" aria-label="Các bước hội thoại" id="waypoints"></nav>
 <div class="work" id="work">
  <section class="chat" aria-label="Hội thoại" id="chat"><div class="history-banner" id="history-banner" hidden><span id="history-label"></span><button id="return-current" type="button"></button></div><div id="turns"></div><button class="task-open" id="open-task" type="button"></button></section>
  <section class="action" aria-labelledby="action-title" id="action"><header class="action-header"><div><h2 id="action-title"></h2><span class="status" id="status" role="status"></span></div><button class="icon" id="close-task" type="button" aria-label="Về hội thoại">×</button></header><div class="action-body" id="action-body"></div><footer class="action-footer" id="action-footer"></footer></section>
 </div>
 <div class="composer-wrap"><form class="composer" id="composer"><textarea rows="1" id="message" aria-label="Hỏi SatsunicGo" placeholder="Nhắn điều bạn muốn làm…" maxlength="1000"></textarea><button class="primary send" type="submit" aria-label="Gửi tin nhắn">↑</button></form><p class="composer-hint" id="composer-hint"></p></div>
</main>
<script>
const $=id=>document.getElementById(id);let vi=true,stage='editing',history=false,revision=0,reviewRevision=-1,consumed=false;
const defaults={product:'Tai nghe không dây A',market:'US',variant:'Đen',quantity:'2',url:'',notes:'',store:'',budget:''};let draft={...defaults};
const t=(a,b)=>vi?a:b;const element=(tag,content,cls)=>{const n=document.createElement(tag);if(content!==undefined)n.textContent=content;if(cls)n.className=cls;return n};
function button(text,fn,cls){const n=element('button',text,cls);n.type='button';n.onclick=fn;return n}
function addTurn(question,answer){const turn=element('article',undefined,'turn');turn.id='turn-'+$('turns').children.length;const q=element('p',question,'question');const a=element('p',answer,'answer');turn.append(q,a);$('turns').append(turn);if(!history)$('chat').scrollTop=$('chat').scrollHeight;return turn.id}
function seed(){ $('turns').replaceChildren();addTurn(t('Mình muốn mua 2 tai nghe màu đen từ Mỹ.','I want two black headphones from the US.'),t('Mình đã điền thông tin bạn vừa chọn. Kiểm tra bản nháp bên cạnh; bạn có thể sửa ngay trong form hoặc nhắn thêm.','I filled in your choices. Review the draft beside this conversation. Edit the form or tell me what to change.'));addTurn(t('Nếu chưa có giá thì sao?','What if the price is not available yet?'),t('Nhân viên sẽ kiểm tra giá và gửi báo giá để bạn xem. Gửi yêu cầu mua hộ chưa phải là thanh toán.','Staff will check the price and send a quote for you to review. Sending a buying request does not make a payment.'));}
function setLabels(){document.documentElement.lang=vi?'vi':'en';$('disclosure').textContent=t('Bản xem trước giao diện · dữ liệu minh họa · không gửi yêu cầu hay thanh toán.','Interface preview · example data · no requests or payments are sent.');$('language').textContent=vi?'English':'Tiếng Việt';$('header-hint').textContent=t('Hỏi, chọn và làm ngay trong chat','Ask, choose and continue in chat');$('restart').setAttribute('aria-label',t('Bắt đầu lại','Start again'));$('message').placeholder=t('Nhắn điều bạn muốn làm…','Ask anything…');$('message').setAttribute('aria-label',t('Hỏi SatsunicGo','Ask SatsunicGo'));$('composer').querySelector('button').setAttribute('aria-label',t('Gửi tin nhắn','Send message'));$('composer-hint').textContent=t('Bạn có thể nhắn để sửa thông tin hoặc tiếp tục.','You can reply to edit details or continue.');$('close-task').setAttribute('aria-label',t('Về hội thoại','Back to chat'));$('return-current').textContent=t('Về tác vụ đang chờ','Return to current task');$('history-label').textContent=t('Đang xem lại · bước đã qua','Reviewing an earlier step');$('open-task').textContent=t('Mở bản nháp mua hộ','Open buying request draft');$('chat').setAttribute('aria-label',t('Hội thoại','Conversation'));$('waypoints').setAttribute('aria-label',t('Các bước hội thoại','Conversation steps'));renderWaypoints()}
function renderWaypoints(){const labels=[t('Chọn sản phẩm','Choose product'),t('Giá và thanh toán','Price and payment'),t('Yêu cầu mua hộ','Buying request')];$('waypoints').replaceChildren();labels.forEach((label,i)=>{const n=button(label,()=>i<2?viewHistory(i):returnCurrent());const dot=element('span',String(i+1),'step-dot');n.prepend(dot);if((history?window.historyIndex:2)===i)n.setAttribute('aria-current','step');$('waypoints').append(n)})}
function viewHistory(index){history=true;window.historyIndex=index;renderWaypoints();$('history-banner').hidden=false;$('work').classList.add('action-closed');const target=$('turn-'+index);if(target)target.scrollIntoView({block:'start'});$('return-current').focus()}
function returnCurrent(){history=false;$('history-banner').hidden=true;$('work').classList.remove('action-closed');renderWaypoints();render();$('action-title').setAttribute('tabindex','-1');$('action-title').focus()}
function field(key,label,options={}){const wrap=element('label',label);let input;if(options.options){input=element('select');options.options.forEach(([v,l])=>{const o=element('option',l);o.value=v;input.append(o)})}else input=element(options.long?'textarea':'input');input.id='field-'+key;input.name=key;input.value=draft[key];if(options.required){input.required=true;wrap.append(element('span',' *'))}if(options.type)input.type=options.type;if(key==='quantity'){input.min='1';input.max='100';input.step='1'}if(key==='product'){input.minLength=2;input.maxLength=200}if(key==='url'){input.maxLength=2048;input.pattern='[hH][tT][tT][pP][sS]?://.+'}if(key==='notes')input.maxLength=2000;if(key==='store')input.maxLength=160;if(key==='variant')input.maxLength=200;if(key==='budget'){input.min='0';input.max='1000000000000';input.step='1'}input.oninput=()=>{if(key==='product')input.setCustomValidity(input.value.trim().length<2?t('Nhập tên sản phẩm có ít nhất 2 ký tự.','Enter a product name with at least 2 characters.'):'');draft[key]=input.value;revision++;consumed=false;reviewRevision=-1;$('status').textContent=t('Thay đổi chưa lưu','Unsaved changes')};wrap.append(input);if(options.hint)wrap.append(element('small',options.hint));return wrap}
function render(){const body=$('action-body'),footer=$('action-footer');body.replaceChildren();footer.replaceChildren();$('action-title').textContent=t('Yêu cầu mua hộ','Buying request');$('status').textContent=stage==='review'?t('Chờ bạn xác nhận','Awaiting your confirmation'):stage==='ready'?t('Bản nháp sẵn sàng · chưa gửi','Draft ready · not sent'):t('Bản nháp · chưa gửi','Draft · not sent');
 if(stage==='editing'){const form=element('form');form.id='draft-form';form.className='form-grid';form.onsubmit=e=>{e.preventDefault();toReview()};form.append(field('product',t('Sản phẩm','Product'),{required:true}),field('url',t('Link sản phẩm','Product link'),{type:'url',hint:t('Có thể bổ sung sau nếu bạn chưa chọn được link.','You can add this later if you have not chosen a link.')}));const pair=element('div',undefined,'pair');pair.append(field('quantity',t('Số lượng','Quantity'),{required:true,type:'number'}),field('variant',t('Mẫu / màu / kích cỡ','Variant / colour / size')));form.append(pair,field('market',t('Mua từ','Buy from'),{required:true,options:[['US',t('Mỹ','United States')],['JP',t('Nhật','Japan')],['KR',t('Hàn Quốc','South Korea')]]}),element('p',t('Thông tin thêm','More details'),'section-title'),field('store',t('Cửa hàng bạn muốn mua','Preferred store'),{hint:t('Để trống nếu bạn muốn nhân viên tìm giúp.','Leave blank if you would like staff to help find a store.')}),field('budget',t('Ngân sách dự kiến (VND)','Preferred budget (VND)'),{type:'number'}),field('notes',t('Ghi chú cho nhân viên','Notes for staff'),{long:true}));body.append(form,element('div',t('Giá cần nhân viên kiểm tra. Bạn sẽ xem báo giá trước khi quyết định bước tiếp theo.','Staff need to check the price. You will review the quote before deciding the next step.'),'note'));footer.append(button(t('Để sau','Later'),()=>{$('work').classList.add('action-closed');$('message').focus()}),button(t('Kiểm tra yêu cầu','Review request'),toReview,'primary'));}
 else{body.append(element('h3',draft.product,'review-title'));const list=element('dl',undefined,'review-list');[[t('Số lượng','Quantity'),draft.quantity],[t('Mẫu','Variant'),draft.variant||t('Chưa chọn','Not selected')],[t('Mua từ','Buy from'),draft.market],[t('Link','Link'),draft.url||t('Chưa bổ sung','Not added')],[t('Cửa hàng','Store'),draft.store||t('Chưa chọn','Not selected')],[t('Ngân sách','Budget'),draft.budget?Number(draft.budget).toLocaleString(vi?'vi-VN':'en-US')+' VND':t('Chưa cung cấp','Not provided')],[t('Ghi chú','Notes'),draft.notes||t('Không có','None')]].forEach(([k,v])=>list.append(element('dt',k),element('dd',v)));body.append(list);const consequence=element('div',undefined,'consequence');consequence.append(element('p',stage==='ready'?t('Bản nháp đã sẵn sàng. Trong bản xem trước này, yêu cầu chưa được gửi.','The draft is ready. In this preview, the request has not been sent.'):t('Gửi yêu cầu này để nhân viên kiểm tra và báo giá? Bạn có thể nhắn “đồng ý” hoặc “chưa gửi”.','Send this request for staff to check and quote? Reply “yes” or “not yet”.')));body.append(consequence,element('p',t('Gửi yêu cầu chưa phải là đặt cọc hay thanh toán.','Sending a request is not a deposit or payment.'),'hint'));footer.append(button(t('Sửa thông tin','Edit details'),()=>{stage='editing';reviewRevision=-1;render();$('field-product').focus()}));if(stage==='review')footer.append(button(t('Gửi yêu cầu mua hộ','Send buying request'),approve,'primary'));}}
function focusTask(){$('action-title').setAttribute('tabindex','-1');$('action-title').focus()}
function toReview(focus=true){if(history)return;$('work').classList.remove('action-closed');const form=$('draft-form');if(form&&!form.reportValidity())return;draft.product=draft.product.trim();stage='review';reviewRevision=revision;consumed=false;render();$('action-body').scrollTop=0;if(focus)focusTask();addTurn(t('Kiểm tra yêu cầu','Review request'),t('Bạn đang kiểm tra đúng bản nháp vừa sửa. Nhắn “đồng ý” để tiếp tục với yêu cầu này, hoặc “chưa gửi” để giữ lại.','You are reviewing the draft you just edited. Reply “yes” to continue with this request, or “not yet” to keep it.'))}
function approve(focus=true){if(history||$('work').classList.contains('action-closed')||stage!=='review'||reviewRevision!==revision||consumed)return false;consumed=true;stage='ready';render();if(focus)focusTask();addTurn(t('Đồng ý','Yes'),t('Bản nháp đã sẵn sàng. Bản xem trước này không gửi yêu cầu thật.','The draft is ready. This preview does not send a real request.'));return true}
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim().replace(/[.!]+$/,'')}
function submit(text){if(!text.trim())return;const s=normalize(text);if(history){addTurn(text,t('Bạn đang xem bước đã qua. Về tác vụ đang chờ để tiếp tục.','You are viewing an earlier step. Return to the current task to continue.'));return}if(['dong y','ok','yes','yes please','go ahead','duoc','gui nhe','u, gui nhe'].includes(s)){if(stage==='editing'||(stage==='review'&&$('work').classList.contains('action-closed'))){addTurn(text,t('Mình mở bản kiểm tra trước. Xem thông tin rồi xác nhận thêm một lần nhé.','I will open the review first. Check the details, then confirm once more.'));toReview(false)}else if(!approve(false))addTurn(text,t('Bản nháp đã sẵn sàng; không có thao tác mới đang chờ xác nhận.','The draft is ready; no new action is awaiting confirmation.'));return}if(['khong','chua gui','thoi','no','not yet','not now','dont do it',"don't do it"].includes(s)){stage='editing';reviewRevision=-1;consumed=false;render();addTurn(text,t('Chưa gửi. Bản nháp vẫn ở đây để bạn sửa.','Not sent. Your draft is still here to edit.'));return}if(['tiep tuc','continue','next'].includes(s)){if(stage==='editing'||(stage==='review'&&$('work').classList.contains('action-closed')))toReview(false);else addTurn(text,t('Kiểm tra yêu cầu rồi nhắn “đồng ý” để xác nhận đúng thao tác đang hiển thị.','Review the request, then reply “yes” to confirm the displayed action.'));return}const match=s.match(/^(?:so luong|quantity)\s*[:=]?\s*(\d+)$/);if(match&&Number(match[1])>=1&&Number(match[1])<=100){draft.quantity=match[1];revision++;stage='editing';reviewRevision=-1;consumed=false;render();addTurn(text,t('Đã đổi số lượng thành '+match[1]+'. Kiểm tra lại trước khi gửi.','Quantity changed to '+match[1]+'. Review before sending.'));return}addTurn(text,t('Bạn muốn sửa thông tin hay gửi yêu cầu đang hiển thị? Có thể nhắn “số lượng 3”, “tiếp tục”, “đồng ý” hoặc “chưa gửi”.','Would you like to edit the details or continue with the displayed request? Try “quantity 3”, “continue”, “yes” or “not yet”.'))}
$('composer').onsubmit=e=>{e.preventDefault();const value=$('message').value;$('message').value='';submit(value);if(!document.activeElement?.closest('#draft-form'))$('message').focus()};$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit()}};$('close-task').onclick=()=>{$('work').classList.add('action-closed');$('open-task').focus()};$('open-task').onclick=returnCurrent;$('return-current').onclick=returnCurrent;$('language').onclick=()=>{vi=!vi;setLabels();seed();render();$('history-banner').hidden=!history;if(history){const target=$('turn-'+window.historyIndex);if(target)target.scrollIntoView({block:'start'})}};$('restart').onclick=()=>{draft={...defaults};stage='editing';revision=0;reviewRevision=-1;consumed=false;history=false;$('history-banner').hidden=true;$('work').classList.remove('action-closed');setLabels();seed();render();$('action-body').scrollTop=0};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('work').classList.contains('action-closed')){e.preventDefault();$('work').classList.add('action-closed');$('open-task').focus()}});setLabels();seed();render();
</script>
</html>
